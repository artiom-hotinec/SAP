services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sap}
      POSTGRES_DB: ${POSTGRES_DB:-sap}
    ports:
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
