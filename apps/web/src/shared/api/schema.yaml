openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /auth/register:
    post:
      operationId: AuthController_signUp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpBodyDto'
      responses:
        '201':
          description: ''
      tags:
        - Auth
  /auth/login:
    post:
      operationId: AuthController_signIn
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInBodyDto'
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: AuthController_signOut
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Auth
  /auth/session:
    get:
      operationId: AuthController_getSessionInfo
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSessionInfoDto'
      tags:
        - Auth
  /user:
    get:
      operationId: UserController_getUser
      parameters: []
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
      tags:
        - User
    patch:
      operationId: UserController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordBodyDto'
      responses:
        '204':
          description: ''
      tags:
        - User
  /statistics:
    get:
      operationId: StatisticsController_getStatistics
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsDto'
      tags:
        - Statistics
  /facilities:
    get:
      operationId: FacilitiesController_getFacilities
      parameters:
        - name: q
          required: false
          in: query
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDto'
      tags:
        - Facilities
    post:
      operationId: FacilitiesController_createFacility
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFacilityItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDto'
      tags:
        - Facilities
  /facilities/{id}:
    patch:
      operationId: FacilitiesController_updateFacility
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacilityItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDto'
      tags:
        - Facilities
    delete:
      operationId: FacilitiesController_deleteFacility
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDto'
      tags:
        - Facilities
  /providers:
    get:
      operationId: ProvidersController_getProviders
      parameters:
        - name: q
          required: false
          in: query
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/ProviderSortBy'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderDto'
      tags:
        - Providers
  /providers/{id}:
    get:
      operationId: ProvidersController_getProvider
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDto'
      tags:
        - Providers
  /device:
    get:
      operationId: DeviceController_getAllDevices
      parameters:
        - name: q
          required: false
          in: query
          schema:
            type: string
        - name: sortBy
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/DeviceSortBy'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceDto'
      tags:
        - Device
    post:
      operationId: DeviceController_createDevice
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDto'
      tags:
        - Device
  /device/{id}:
    patch:
      operationId: DeviceController_updateDevice
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDto'
      tags:
        - Device
    delete:
      operationId: DeviceController_deleteDevice
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDto'
      tags:
        - Device
  /device-model/{gtin}:
    get:
      operationId: DeviceModelController_getDeviceModelByGtin
      parameters:
        - name: gtin
          required: true
          in: path
          schema:
            type: string
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModelDto'
      tags:
        - DeviceModel
  /device-model:
    post:
      operationId: DeviceModelController_createDeviceModel
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceModelItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModelDto'
      tags:
        - DeviceModel
  /device-model/{id}:
    patch:
      operationId: DeviceModelController_updateDeviceModel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceModelItemDto'
      responses:
        default:
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModelDto'
      tags:
        - DeviceModel
info:
  title: SAP
  description: API documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    SignUpBodyDto:
      type: object
      properties:
        email:
          type: string
          example: test@gmail.com
        password:
          type: string
          example: '1234'
      required:
        - email
        - password
    SignInBodyDto:
      type: object
      properties:
        email:
          type: string
          example: test@gmail.com
        password:
          type: string
          example: '1234'
      required:
        - email
        - password
    GetSessionInfoDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        iat:
          type: number
        exp:
          type: number
      required:
        - id
        - email
        - iat
        - exp
    UserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        unitsPreference:
          type: string
          enum:
            - IMPERIAL
            - METRIC
        role:
          type: string
          enum:
            - PATIENT
            - PORTAL_ADMIN
            - PROVIDER
            - SUPER_ADMIN
      required:
        - id
        - email
        - firstName
        - lastName
        - avatar
        - phone
        - unitsPreference
        - role
    ChangePasswordBodyDto:
      type: object
      properties:
        oldPassword:
          type: string
          example: '1234'
        newPassword:
          type: string
          example: '4321'
      required:
        - oldPassword
        - newPassword
    StatisticsDto:
      type: object
      properties:
        patients:
          type: number
        facilities:
          type: number
        providers:
          type: number
        devices:
          type: number
      required:
        - patients
        - facilities
        - providers
        - devices
    FacilityDto:
      type: object
      properties:
        id:
          type: string
        ein:
          type: string
        permit:
          type: string
        npi:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: object
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - ein
        - permit
        - npi
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
        - active
        - createdAt
    AddFacilityItemDto:
      type: object
      properties:
        ein:
          type: string
        permit:
          type: string
        npi:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: string
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
      required:
        - ein
        - permit
        - npi
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
    UpdateFacilityItemDto:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: string
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
      required:
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
    ProviderSortBy:
      type: string
      enum:
        - providerName
        - facilityName
    ProviderDto:
      type: object
      properties:
        id:
          type: string
        providerName:
          type: string
        email:
          type: string
        npi:
          type: string
        phone:
          type: string
        address:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        facilityName:
          type: string
        dateHired:
          format: date-time
          type: string
      required:
        - id
        - providerName
        - email
        - npi
        - phone
        - address
        - firstName
        - lastName
        - facilityName
        - dateHired
    DeviceSortBy:
      type: string
      enum:
        - model
        - dateAdded
    DeviceDto:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        modelName:
          type: string
        facilityName:
          type: string
          nullable: true
        manufactureDate:
          type: string
          format: date-time
        lastConnectedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - deviceId
        - modelName
        - facilityName
        - manufactureDate
        - lastConnectedAt
    AddDeviceItemDto:
      type: object
      properties:
        deviceId:
          type: string
        facilityId:
          type: string
      required:
        - deviceId
    UpdateDeviceItemDto:
      type: object
      properties:
        deviceId:
          type: string
          example: (01)00827002005112(11)210821(10)1234(21)8234
        facilityId:
          type: string
      required:
        - deviceId
    DeviceModelDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gtin:
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - gtin
        - createdAt
        - updatedAt
    AddDeviceModelItemDto:
      type: object
      properties:
        name:
          type: string
          example: SAP 2
        gtin:
          type: string
          example: '00827002005112'
      required:
        - name
    UpdateDeviceModelItemDto:
      type: object
      properties:
        name:
          type: string
          example: SAP 2
        gtin:
          type: string
          example: '00827002005112'
          description: GTIN-14. Cannot be changed once devices use the model.
