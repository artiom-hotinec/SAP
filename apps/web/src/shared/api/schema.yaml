    post:
      operationId: PatientMessageController_sendMessage
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientMessageDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMessageDto'
        '404':
          description: Unknown patient
      tags:
        - PatientMessage
  /patients/{patientId}/documents:
    get:
      operationId: PatientDocumentController_getDocuments
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientDocumentDto'
        '404':
          description: Unknown patient
      tags:
        - PatientDocument
    post:
      operationId: PatientDocumentController_uploadDocument
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadPatientDocumentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocumentDto'
        '404':
          description: Unknown patient
      tags:
        - PatientDocument
  /patients/{patientId}/documents/{documentId}/file:
    get:
      operationId: PatientDocumentController_downloadDocument
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
        - name: documentId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown patient or document
      tags:
        - PatientDocument
  /patients/{patientId}/documents/{documentId}:
    delete:
      operationId: PatientDocumentController_deleteDocument
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
        - name: documentId
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
        '404':
          description: Unknown patient or document
      tags:
        - PatientDocument
  /patients/{patientId}/notes:
    get:
      operationId: PatientNoteController_getNotes
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientNoteDto'
        '404':
          description: Unknown patient
      tags:
        - PatientNote
    post:
      operationId: PatientNoteController_createNote
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientNoteDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientNoteDto'
        '404':
          description: Unknown patient
      tags:
        - PatientNote
info:
  title: SAP
  description: API documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    SignUpBodyDto:
      type: object
      properties:
        email:
          type: string
          example: test@gmail.com
        password:
          type: string
          example: '1234'
      required:
        - email
        - password
    SignInBodyDto:
      type: object
      properties:
        email:
          type: string
          example: test@gmail.com
        password:
          type: string
          example: '1234'
      required:
        - email
        - password
    GetSessionInfoDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        iat:
          type: number
        exp:
          type: number
      required:
        - id
        - email
        - iat
        - exp
    UserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        unitsPreference:
          type: string
          enum:
            - IMPERIAL
            - METRIC
        role:
          type: string
          enum:
            - PATIENT
            - PORTAL_ADMIN
            - PROVIDER
            - SUPER_ADMIN
      required:
        - id
        - email
        - firstName
        - lastName
        - avatar
        - phone
        - unitsPreference
        - role
    ChangePasswordBodyDto:
      type: object
      properties:
        oldPassword:
          type: string
          example: '1234'
        newPassword:
          type: string
          example: '4321'
      required:
        - oldPassword
        - newPassword
    StatisticsDto:
      type: object
      properties:
        patients:
          type: number
        facilities:
          type: number
        providers:
          type: number
        devices:
          type: number
      required:
        - patients
        - facilities
        - providers
        - devices
    FacilityDto:
      type: object
      properties:
        id:
          type: string
        ein:
          type: string
        permit:
          type: string
        npi:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: object
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - ein
        - permit
        - npi
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
        - active
        - createdAt
    AddFacilityItemDto:
      type: object
      properties:
        ein:
          type: string
        permit:
          type: string
        npi:
          type: string
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: string
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
      required:
        - ein
        - permit
        - npi
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
    UpdateFacilityItemDto:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        address:
          type: string
        unit:
          type: string
        zip:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
      required:
        - name
        - city
        - state
        - phone
        - address
        - zip
        - contactName
        - contactEmail
    ProviderSortBy:
      type: string
      enum:
        - providerName
        - facilityName
    ProviderDto:
      type: object
      properties:
        id:
          type: string
        providerName:
          type: string
        email:
          type: string
        npi:
          type: string
          nullable: true
        phone:
          type: string
        address:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        facilityName:
          type: string
        dateHired:
          format: date-time
          type: string
          nullable: true
      required:
        - id
        - providerName
        - email
        - npi
        - phone
        - address
        - firstName
        - lastName
        - facilityName
        - dateHired
    DeviceSortBy:
      type: string
      enum:
        - model
        - dateAdded
    DeviceDto:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        modelName:
          type: string
        facilityName:
          type: string
          nullable: true
        manufactureDate:
          type: string
          format: date-time
        lastConnectedAt:
          type: string
          format: date-time
          nullable: true
        assigned:
          type: boolean
          description: Assigned to a patient
      required:
        - id
        - deviceId
        - modelName
        - facilityName
        - manufactureDate
        - lastConnectedAt
        - assigned
    AddDeviceItemDto:
      type: object
      properties:
        deviceId:
          type: string
        facilityId:
          type: string
      required:
        - deviceId
    UpdateDeviceItemDto:
      type: object
      properties:
        deviceId:
          type: string
          example: (01)00827002005112(11)210821(10)1234(21)8234
        facilityId:
          type: string
      required:
        - deviceId
    DeviceModelDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        gtin:
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - gtin
        - createdAt
    AddDeviceModelItemDto:
      type: object
      properties:
        name:
          type: string
          example: SAP 2
        gtin:
          type: string
          example: '00827002005112'
      required:
        - name
    UpdateDeviceModelItemDto:
      type: object
      properties:
        name:
          type: string
          example: SAP 2
        gtin:
          type: string
          example: '00827002005112'
          description: GTIN-14. Cannot be changed once devices use the model.
    PatientSortBy:
      type: string
      enum:
        - lastName
        - dateAdded
        - unreadMessages
    PatientFilterBy:
      type: string
      enum:
        - allPatients
        - activePatients
        - inActivePatients
        - myPatients
    Sex:
      type: string
      enum:
        - FEMALE
        - MALE
        - OTHER
    PatientDto:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
          format: date-time
          nullable: true
        sex:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Sex'
        heightIn:
          type: number
          nullable: true
        weightLb:
          type: number
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        providerId:
          type: string
        providerName:
          type: string
          description: Provider first + last name
        lastAppointment:
          type: string
          format: date-time
          nullable: true
        registered:
          type: boolean
          description: Has the patient registered in the mobile app (userId set)
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - dob
        - sex
        - heightIn
        - weightLb
        - address
        - city
        - state
        - unit
        - zip
        - providerId
        - providerName
        - lastAppointment
        - registered
        - createdAt
    CreatePatientClinicalInfoDto:
      type: object
      properties:
        lastAppointment:
          type: string
          format: date
          example: '2021-12-11'
        maskFitting:
          type: boolean
        maskFittingDate:
          type: string
          format: date
          description: Required when maskFitting is true
        sleepStudy:
          type: boolean
        sleepStudyDate:
          type: string
          format: date
          description: Required when sleepStudy is true
        atHomeStudy:
          type: boolean
        sleepStudyBloodOxygenPct:
          type: number
