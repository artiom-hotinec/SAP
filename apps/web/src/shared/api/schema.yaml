  /patients/{id}/photo:
    put:
      operationId: PatientController_addPhoto
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '400':
          description: invalid-photo (not JPG/PNG/TIFF, or over 5 MB)
        '404':
          description: Unknown patient
      tags:
        - Patient
    get:
      operationId: PatientController_getPhoto
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown patient or no photo
      tags:
        - Patient
    delete:
      operationId: PatientController_deletePhoto
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDto'
        '404':
          description: Unknown patient or no photo
      tags:
        - Patient
  /patients/{patientId}/messages:
    get:
      operationId: PatientMessageController_getMessages
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientMessageDto'
        '404':
